name: GitWorld - Update Profile

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  gitworld:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitWorld SVG + Profile Card
        uses: Dasmat13/git-world-action@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg

      - name: Add longest streak badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.request, datetime

          USER = os.environ["USER_NAME"]
          TOKEN = os.environ["GH_TOKEN"]

          def gql(query, variables):
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as r:
                  return json.load(r)["data"]

          # --- policz najdluzsza passe od zalozenia konta ---
          created = gql("query($u:String!){user(login:$u){createdAt}}", {"u": USER})["user"]["createdAt"]
          now = datetime.datetime.utcnow()
          Q = """query($u:String!,$from:DateTime!,$to:DateTime!){user(login:$u){
                 contributionsCollection(from:$from,to:$to){contributionCalendar{
                 weeks{contributionDays{date contributionCount}}}}}}"""
          days = {}
          for y in range(int(created[:4]), now.year + 1):
              frm = f"{y}-01-01T00:00:00Z"
              to = f"{y}-12-31T23:59:59Z" if y < now.year else now.strftime("%Y-%m-%dT%H:%M:%SZ")
              data = gql(Q, {"u": USER, "from": frm, "to": to})
              for w in data["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
                  for d in w["contributionDays"]:
                      days[d["date"]] = d["contributionCount"]

          longest = cur = 0
          for date in sorted(days):
              cur = cur + 1 if days[date] > 0 else 0
              longest = max(longest, cur)
          print(f"Najdluzsza passa: {longest} dni")

          # --- skopiuj oryginalna plakietke "Xd streak" ---
          path = "dist/gitworld.svg"
          with open(path, encoding="utf-8") as f:
              svg = f.read()

          tm = re.search(
              r'<text\b[^>]*>(?:(?!</text>).)*?\d+d streak(?:(?!</text>).)*?</text>',
              svg, flags=re.S,
          )
          if not tm:
              i = svg.find("streak")
              print("Nie znaleziono plakietki. Fragment pliku:")
              print(svg[max(0, i - 800): i + 200])
              sys.exit(1)

          rs = svg.rfind("<rect", 0, tm.start())
          chunk = svg[rs:tm.end()]
          print("Oryginalna plakietka:\n" + chunk)

          rect_tag = re.match(r'<rect\b[^>]*>', chunk).group(0)
          H = float(re.search(r'\sheight="([\d.]+)"', rect_tag).group(1))
          GAP_PX = 8
          dy = H + H * GAP_PX / 44  # 44px = wysokosc plakietki na ekranie

          new = chunk
          new = re.sub(
              r'(\s(?:y|y1|y2|cy))="([\d.\-]+)"',
              lambda m: f'{m.group(1)}="{float(m.group(2)) + dy:.2f}"',
              new,
          )
          new = re.sub(
              r'translate\(\s*([\d.\-]+)[\s,]+([\d.\-]+)\s*\)',
              lambda m: f'translate({m.group(1)},{float(m.group(2)) + dy:.2f})',
              new,
          )
          new = re.sub(r'\sid="[^"]*"', "", new)
          new = re.sub(r'\d+d streak', f'{longest}d best streak', new)
          new = new.replace("🔥", "🏆")

          svg = svg[:tm.end()] + f'<g id="longest-streak">{new}</g>' + svg[tm.end():]

          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

      - name: Commit & Push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/gitworld.svg dist/profile-card.svg
          git diff --cached --quiet || git commit -m "Update GitWorld [$(date +'%Y-%m-%d')]"
          git push
