name: GitWorld - Update Profile

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  gitworld:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitWorld SVG + Profile Card
        uses: Dasmat13/git-world-action@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg

      - name: Commit & Push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/gitworld.svg dist/profile-card.svg
          git diff --cached --quiet || git commit -m "Update GitWorld [$(date +'%Y-%m-%d')]"
          git push
